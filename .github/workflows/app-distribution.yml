name: App Distribution

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        type: string
        required: true
        default: '0.0.6'
        description: SDK version on Maven Central to build the example against
      environment:
        type: choice
        required: true
        default: sandbox
        description: Target environment for app distribution
        options:
          - sandbox
          - staging
      release_notes:
        type: string
        required: true
        default: Manual Debug Build
        description: Release notes for the distribution

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build & Distribute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ ! -f "${ANDROID_SDK_ROOT}/licenses/android-sdk-license" ]; then
            yes | sdkmanager --licenses >/dev/null || true
          fi
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build release APK against published SDK
        shell: bash
        env:
          VRTX_CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          VRTX_CLIENT_SECRET: ${{ secrets.VRTX_CLIENT_SECRET }}
          VRTX_ENVIRONMENT: ${{ inputs.environment }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          FLAVOR="${VRTX_ENVIRONMENT^}"  # capitalize first letter: sandbox -> Sandbox
          ./gradlew -p example ":app:assemble${FLAVOR}Release" \
            -PsdkVersion=$SDK_VERSION --no-daemon --build-cache

      - name: Install Firebase CLI
        shell: bash
        run: npm install -g firebase-tools@15.12.0

      - name: Authenticate to Firebase
        shell: bash
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "${KEY_FILE}"
          printf '%s' "${FIREBASE_KEY}" > "${KEY_FILE}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${KEY_FILE}" >> "${GITHUB_ENV}"

      - name: Distribute APK to Firebase
        shell: bash
        env:
          SANDBOX_APP_ID: ${{ secrets.SANDBOX_FIREBASE_APP_ID }}
          STAGING_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          if [[ "${ENVIRONMENT}" == "sandbox" ]]; then
            APP_ID="${SANDBOX_APP_ID}"
          else
            APP_ID="${STAGING_APP_ID}"
          fi
          NOTES_FILE=$(mktemp)
          printf '%s' "${RELEASE_NOTES}" > "${NOTES_FILE}"
          TESTERS_FILE=$(mktemp)
          printf '%s' "${TESTERS}" > "${TESTERS_FILE}"
          APK_PATH="example/app/build/outputs/apk/${ENVIRONMENT}/release/app-${ENVIRONMENT}-release.apk"
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${APP_ID}" \
            --release-notes-file "${NOTES_FILE}" \
            --testers-file "${TESTERS_FILE}"

      - name: Clean up credentials
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ] && rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
