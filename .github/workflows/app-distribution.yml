name: App Distribution

on:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump type.
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      release_notes:
        description: Release notes for Firebase App Distribution.
        type: string
        required: true
        default: Manual release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'demo-*' --sort=-v:refname | grep -E '^demo-[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          current=${latest#demo-}
          current=${current:-1.0.0}
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          version="$major.$minor.$patch"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

  distribute:
    name: Build & Distribute
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ ! -f "${ANDROID_SDK_ROOT}/licenses/android-sdk-license" ]; then
            yes | sdkmanager --licenses >/dev/null || true
          fi
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" \
            && test -n "$ANDROID_KEYSTORE_PASSWORD" \
            && test -n "$ANDROID_KEY_ALIAS" \
            && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/android-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD do not describe the same keystore."
            exit 1
          fi
          if ! keytool -certreq -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/android-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -file "$RUNNER_TEMP/android-release.csr" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is invalid for this keystore."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/android-release.csr"

      - name: Build signed Sandbox release APK
        shell: bash
        env:
          VRTX_CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          VRTX_CLIENT_SECRET: ${{ secrets.VRTX_CLIENT_SECRET }}
          VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
          VRTX_ENVIRONMENT: Sandbox
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          ./gradlew -p example :app:assembleSandboxRelease \
            -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_VERSION_CODE" \
            --no-daemon --build-cache

      - name: Upload APK artifact
        id: apk-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-sandbox-native-${{ needs.prepare.outputs.version }}
          path: example/app/build/outputs/apk/sandbox/release/app-sandbox-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Install Firebase CLI
        shell: bash
        run: npm install -g firebase-tools@15.12.0

      - name: Authenticate to Firebase
        shell: bash
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "${KEY_FILE}"
          printf '%s' "${FIREBASE_KEY}" > "${KEY_FILE}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${KEY_FILE}" >> "${GITHUB_ENV}"

      - name: Distribute APK to Firebase
        shell: bash
        env:
          SANDBOX_APP_ID: ${{ secrets.SANDBOX_FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          NOTES_FILE=$(mktemp)
          printf '%s' "${RELEASE_NOTES}" > "${NOTES_FILE}"
          TESTERS_FILE=$(mktemp)
          printf '%s' "${TESTERS}" > "${TESTERS_FILE}"
          APK_PATH="example/app/build/outputs/apk/sandbox/release/app-sandbox-release.apk"
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${SANDBOX_APP_ID}" \
            --release-notes-file "${NOTES_FILE}" \
            --testers-file "${TESTERS_FILE}"

      - name: Upload preview to Appetize.io
        id: appetize
        shell: bash
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APPETIZE_TOKEN}" ]; then
            echo "::error::APPETIZE_API_TOKEN is not set."
            exit 1
          fi
          response=$(curl -sS --fail-with-body \
            -H "X-API-KEY: ${APPETIZE_TOKEN}" \
            --form "file=@example/app/build/outputs/apk/sandbox/release/app-sandbox-release.apk" \
            --form "platform=android" \
            "https://api.appetize.io/v1/apps")
          public_url=$(jq -r '.publicURL // empty' <<<"${response}")
          if [ -z "${public_url}" ]; then
            echo "::error::Appetize upload succeeded but no publicURL returned. Response:"
            echo "${response}"
            exit 1
          fi
          echo "url=${public_url}" >> "${GITHUB_OUTPUT}"
          echo "Appetize preview: ${public_url}"

      - name: Notify Slack
        shell: bash
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
          CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          APPETIZE_URL: ${{ steps.appetize.outputs.url }}
          APK_ARTIFACT_URL: ${{ steps.apk-artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; skipping release announcement."
            exit 0
          fi
          title="Public Android Demo App ${VERSION} Available (sandbox · ${CLIENT_ID})"
          context="Environment: sandbox · Client ID: ${CLIENT_ID} · <${APPETIZE_URL}|Appetize preview>"
          if [ -n "${APK_ARTIFACT_URL}" ]; then
            context="${context} · <${APK_ARTIFACT_URL}|APK (expires in 7d)>"
          fi
          payload=$(jq -n \
            --arg title "${title}" \
            --arg notes "${NOTES}" \
            --arg context "${context}" \
            '{
              blocks: [
                {type: "header", text: {type: "plain_text", text: $title}},
                {type: "section", text: {type: "mrkdwn", text: $notes}},
                {type: "context", elements: [{type: "mrkdwn", text: $context}]}
              ]
            }')
          response=$(curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            --data "${payload}" "${WEBHOOK}") || {
              echo "::warning::Slack webhook curl failed: ${response}"
              exit 0
            }
          if [ "${response}" != "ok" ]; then
            echo "::warning::Slack webhook responded: ${response}"
          fi

      - name: Clean up credentials
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ] && rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
