name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build example app
        env:
          VRTX_CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          VRTX_CLIENT_SECRET: ${{ secrets.VRTX_CLIENT_SECRET }}
          VRTX_ENVIRONMENT: staging
          SDK_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if [ -n "$SDK_VERSION" ]; then
            ./gradlew -p example :app:assembleDebug -PsdkVersion="$SDK_VERSION"
          else
            ./gradlew -p example :app:assembleDebug
          fi
