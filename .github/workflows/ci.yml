name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build example app
        env:
          VRTX_CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          VRTX_CLIENT_SECRET: ${{ secrets.VRTX_CLIENT_SECRET }}
          VRTX_ENVIRONMENT: Sandbox
          SDK_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if [ -n "$SDK_VERSION" ]; then
            ./gradlew -p example :app:assembleDebug -PsdkVersion="$SDK_VERSION"
          else
            ./gradlew -p example :app:assembleDebug
          fi

  signed-release:
    name: Build signed release APK
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" \
            && test -n "$ANDROID_KEYSTORE_PASSWORD" \
            && test -n "$ANDROID_KEY_ALIAS" \
            && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          keytool -certreq -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/android-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -file "$RUNNER_TEMP/android-release.csr" >/dev/null
          rm -f "$RUNNER_TEMP/android-release.csr"

      - name: Build signed Sandbox release APK
        env:
          VRTX_CLIENT_ID: ${{ secrets.VRTX_CLIENT_ID }}
          VRTX_CLIENT_SECRET: ${{ secrets.VRTX_CLIENT_SECRET }}
          VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
          VRTX_ENVIRONMENT: Sandbox
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SDK_VERSION: ${{ github.event.release.tag_name }}
        run: |
          ./gradlew -p example :app:assembleSandboxRelease -PsdkVersion="$SDK_VERSION"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vrtx-sandbox-signed-${{ github.event.release.tag_name }}
          path: example/app/build/outputs/apk/sandbox/release/app-sandbox-release.apk
          if-no-files-found: error
          retention-days: 14
