version: 2
updates:
  - package-ecosystem: gradle
    # Version updates off: upgrades are coordinated so related pins and config
    # move together. Security alerts and security updates are unaffected.
    open-pull-requests-limit: 0
    directory: /
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    # Version updates off: upgrades are coordinated so related pins and config
    # move together. Security alerts and security updates are unaffected.
    open-pull-requests-limit: 0
    directory: /example
    commit-message:
      prefix: "demo"
      include: "scope"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Version updates off: upgrades are coordinated so related pins and config
    # move together. Security alerts and security updates are unaffected.
    open-pull-requests-limit: 0
    directory: /
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
